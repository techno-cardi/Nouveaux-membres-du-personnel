name: Correction chemin Mozaik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mozaik-path.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Utiliser le fichier moz.png fourni
        run: |
          python3 <<'PY'
          from pathlib import Path

          replacements = {
              'global-search-flash.js': [
                  ("const MOZAIK_LOGO = 'assets/mozaik.svg';", "const MOZAIK_LOGO = 'assets/vendor/moz.png';"),
                  ("const MOZAIK_LOGO = 'assets/mozaik.png';", "const MOZAIK_LOGO = 'assets/vendor/moz.png';"),
              ],
              '.github/workflows/cache-logo-assets.yml': [
                  ("mapping['__mozaik__'] = 'assets/mozaik.svg'", "mapping['__mozaik__'] = 'assets/vendor/moz.png'"),
                  ("\"const MOZAIK_LOGO = 'assets/mozaik.svg';\"", "\"const MOZAIK_LOGO = 'assets/vendor/moz.png';\""),
              ],
          }

          for filename, pairs in replacements.items():
              path = Path(filename)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text == original:
                  print(f'Aucun ancien chemin trouvé dans {filename}')
              else:
                  path.write_text(text, encoding='utf-8')
                  print(f'Corrigé: {filename}')

          # Sécurité: les fichiers centraux doivent tous pointer vers le fichier fourni.
          checks = {
              'source-patches-5.js': "assets/vendor/moz.png",
              'assets-map.js': "assets/vendor/moz.png",
              'global-search-flash.js': "assets/vendor/moz.png",
              '.github/workflows/cache-logo-assets.yml': "assets/vendor/moz.png",
          }
          for filename, expected in checks.items():
              text = Path(filename).read_text(encoding='utf-8')
              if expected not in text:
                  raise SystemExit(f'{filename} ne pointe pas vers {expected}')
          PY
      - name: Enregistrer la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-search-flash.js .github/workflows/cache-logo-assets.yml
          git commit -m "Utiliser moz.png partout pour Mozaik"
          git push
