name: Correction moteur de recherche

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-search-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Éviter les faux rapprochements sur les mots très courts
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('global-search-flash.js')
          text = path.read_text(encoding='utf-8')
          old = 'if (word.startsWith(candidate) || candidate.startsWith(word)) {'
          new = 'if (word.length >= 3 && (word.startsWith(candidate) || candidate.startsWith(word))) {'
          if old not in text:
              raise SystemExit('Comparaison partielle introuvable.')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Enregistrer la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-search-flash.js
          git commit -m "Éviter les faux positifs de recherche partielle"
          git push
