name: Correction moteur de recherche

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-search-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Supprimer la déclaration HTML en double
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('global-search-flash.js')
          text = path.read_text(encoding='utf-8')
          marker = '  const escapeHtml = value =>'
          first = text.find(marker)
          second = text.find(marker, first + len(marker)) if first >= 0 else -1
          if first < 0 or second < 0:
              raise SystemExit(f'Deuxième déclaration escapeHtml introuvable. Occurrences: {text.count(marker)}')
          end_marker = '\n  const accentPattern = token =>'
          end = text.find(end_marker, second)
          if end < 0:
              raise SystemExit('Fin de la deuxième déclaration escapeHtml introuvable.')
          text = text[:second] + text[end + 1:]
          if text.count(marker) != 1:
              raise SystemExit(f'Nombre inattendu de déclarations escapeHtml après correction: {text.count(marker)}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Enregistrer la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-search-flash.js
          git commit -m "Corriger la déclaration en double du moteur de recherche"
          git push
