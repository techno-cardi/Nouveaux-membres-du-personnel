name: Correction moteur de recherche

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-search-engine.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Supprimer la déclaration HTML en double
        run: |
          python3 <<'PY'
          from pathlib import Path

          path = Path('global-search-flash.js')
          text = path.read_text(encoding='utf-8')
          block = """  const escapeHtml = value => String(value || '')
            .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\"/g,'&quot;');

          """
          if block not in text:
              raise SystemExit('Déclaration en double introuvable, aucun changement appliqué.')
          text = text.replace(block, '', 1)
          if text.count('const escapeHtml =') != 1:
              raise SystemExit(f'Nombre inattendu de déclarations escapeHtml après correction: {text.count("const escapeHtml =")}')
          path.write_text(text, encoding='utf-8')
          PY
      - name: Enregistrer la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add global-search-flash.js
          git commit -m "Corriger la déclaration en double du moteur de recherche"
          git push
