name: Correction icone Mozaik

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-mozaik-icon.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extraire le PNG Mozaik et corriger les references
        run: |
          python3 <<'PY'
          from pathlib import Path
          import base64, re

          svg_path = Path('assets/mozaik.svg')
          svg = svg_path.read_text(encoding='utf-8')
          match = re.search(r'data:image/png;base64,([^"\']+)', svg)
          if not match:
              raise SystemExit('Image PNG integree introuvable dans assets/mozaik.svg')

          png_path = Path('assets/mozaik.png')
          png_path.write_bytes(base64.b64decode(match.group(1)))
          if png_path.stat().st_size < 1000:
              raise SystemExit('PNG Mozaik extrait anormalement petit')

          patches = Path('source-patches-5.js')
          text = patches.read_text(encoding='utf-8')
          old = "const MOZAIK_LOGO = 'assets/mozaik.svg';"
          new = "const MOZAIK_LOGO = 'assets/mozaik.png';"
          if old not in text:
              raise SystemExit('Reference Mozaik attendue introuvable dans source-patches-5.js')
          patches.write_text(text.replace(old, new, 1), encoding='utf-8')

          asset_map = Path('assets-map.js')
          text = asset_map.read_text(encoding='utf-8')
          old = '"__mozaik__": "assets/mozaik.svg"'
          new = '"__mozaik__": "assets/mozaik.png"'
          if old not in text:
              raise SystemExit('Reference Mozaik attendue introuvable dans assets-map.js')
          asset_map.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Enregistrer la correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/mozaik.png source-patches-5.js assets-map.js
          git commit -m "Corriger l'icone Mozaik"
          git push
