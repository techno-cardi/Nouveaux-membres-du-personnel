<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#7f1427">
<meta name="description" content="Guide du personnel de l'École secondaire Cardinal-Roy">
<title>Guide du personnel | Cardinal-Roy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Serif:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="logo.css">
<link rel="stylesheet" href="guide-updates.css">
</head>
<body>
<div id="legacy-source" hidden aria-hidden="true"></div>
<div id="app" aria-live="polite"></div>
<noscript><main class="page"><h1>Guide du personnel</h1><p>JavaScript doit être activé pour consulter ce guide.</p></main></noscript>
<script>
const files=['body-part-00.txt','body-part-01.txt','body-part-02.txt','body-part-03.txt','body-part-04.txt','body-part-05.txt'];
const decodeUtf8Base64=b64=>{
  const bytes=Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
};
const loadScript=src=>new Promise((resolve,reject)=>{
  const s=document.createElement('script');
  s.src=src;
  s.onload=resolve;
  s.onerror=reject;
  document.body.appendChild(s);
});
Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok) throw new Error(f); return r.text();})))
  .then(async parts=>{
    document.getElementById('legacy-source').innerHTML=decodeUtf8Base64(parts.join(''));
    await loadScript('source-patches.js');
    await loadScript('source-patches-2.js');
    await loadScript('source-patches-3.js');
    await loadScript('source-patches-4.js');
    await loadScript('ui-polish.js');
    await loadScript('after-ui.js');
  })
  .catch(error=>{
    console.error(error);
    document.getElementById('app').innerHTML='<main class="page"><h1>Guide du personnel</h1><p>Le guide n’a pas pu être chargé. Rechargez la page pour réessayer.</p></main>';
  });
</script>
</body>
</html>
