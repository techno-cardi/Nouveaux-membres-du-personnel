<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f3f0e9">
<meta name="description" content="Guide du personnel de l'École secondaire Cardinal-Roy">
<title>Guide du personnel | Cardinal-Roy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="logo.css">
</head>
<body>
<a class="skip-link" href="#main-content">Aller au contenu</a>
<div id="app"></div>
<script>
const files=['body-part-00.txt','body-part-01.txt','body-part-02.txt','body-part-03.txt','body-part-04.txt','body-part-05.txt'];
const decodeUtf8Base64=b64=>{
  const bytes=Uint8Array.from(atob(b64.replace(/\s/g,'')),c=>c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
};
Promise.all(files.map(f=>fetch(f).then(r=>{if(!r.ok) throw new Error(f); return r.text();})))
  .then(parts=>{
    document.getElementById('app').outerHTML=decodeUtf8Base64(parts.join(''));
    const s=document.createElement('script');
    s.src='script.js';
    s.onload=()=>{
      const polish=document.createElement('script');
      polish.src='ui-polish.js';
      document.body.appendChild(polish);
    };
    document.body.appendChild(s);
  })
  .catch(()=>{
    document.getElementById('app').innerHTML='<main class="shell" id="main-content" style="padding:40px 0"><h1>Le guide n’a pas pu être chargé.</h1><p>Rechargez la page pour réessayer.</p></main>';
  });
</script>
</body>
</html>
